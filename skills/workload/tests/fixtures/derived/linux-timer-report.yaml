schema_version: 1
scope: user
id: linux-timer-report
purpose: "The same daily report carried by a timer unit instead of a launchd agent"
placement: {host: host-b, kind: recurring, runtime: systemd, owner: bridge}
schedule:
  rrule: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR"
  delivery_at: "06:30"
  duration_estimate_min: 20
  timezone: Europe/Berlin
execution:
  command: ["/opt/bridge/scripts/daily-health-report.sh"]
  timeout_sec: 600
  isolation: process-group
  single_flight: true
response: {evidence: log-trace, notify_on: [failure, timeout, missing]}
