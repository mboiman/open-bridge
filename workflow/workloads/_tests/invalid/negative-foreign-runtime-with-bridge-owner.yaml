purpose: "Control: a foreign runtime with the Bridge as owner must be refused"
placement: {host: host-a, kind: daemon, runtime: external, owner: bridge}
reconcile: {probe: "curl -sS -o /dev/null -w '%{http_code}' https://example/health", expect: "200"}
