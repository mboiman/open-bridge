# Control for: placement.provisioned_at needs an ISO 8601 instant.
# A stamp that cannot be sorted against another stamp does not answer the one
# question it exists for: what ran when.
schema_version: 1
scope: user
id: negative-provisioned-at-as-prose
purpose: "Control: a provisioning time written as prose must be refused"
placement: {host: host-a, kind: daemon, runtime: launchd, owner: human, provisioned_at: "yesterday evening"}
