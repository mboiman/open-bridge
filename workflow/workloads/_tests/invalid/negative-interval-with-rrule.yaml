schema_version: 1
scope: user
id: negative-interval-with-rrule
purpose: "Control: an interval job is not a recurrence, rrule must be refused"
placement: {host: example-host, kind: interval, runtime: launchd, owner: bridge}
schedule: {every_sec: 900, rrule: "FREQ=DAILY", timezone: Europe/Berlin}
execution: {command: ["/bin/true"], timeout_sec: 60}
response: {evidence: exit-code}
