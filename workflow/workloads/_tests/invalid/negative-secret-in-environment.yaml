# Control for: execution.env, the pattern of the VALUE.
#
# execution.env promised "literal values only. Secrets by reference, never
# inline." and enforced neither half. A plaintext key went through both gates
# and then travelled twice: verbatim into the unit file on the machine
# (Environment= or EnvironmentVariables) and, because the declaration is a
# tracked file, into git and onward with the scope router.
#
# The value below is invented and deliberately carries NO real token shape.
# That is the point of the rule: it is refused not because it looks like a
# secret, but because it is a value at all instead of a reference.
schema_version: 1
scope: user
id: negative-secret-in-environment
purpose: "Control: a plaintext value in execution.env must be refused"
placement: {host: host-a, kind: daemon, runtime: launchd, owner: human}
execution:
  command: ["/bin/true"]
  timeout_sec: 60
  env: {SERVICE_API_KEY: "sk-live-example-value-not-a-real-key"}
